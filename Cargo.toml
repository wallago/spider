[workspace]
members  = ["firmware"]
resolver = "3"

[workspace.package]
version      = "0.1.0"
authors      = ["wallago <tbd@gmail.com>"]
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/wallago/spider"
edition      = "2024"
rust-version = "1.88"

[profile.dev]
# Firmware at opt-level 0 is bulky and can miss HAL timing; "s" is the esp-rs
# default for debug builds.
debug     = true
opt-level = "s"

[profile.test]
debug     = true
opt-level = 0

[profile.release]
opt-level = "s"
# espflash symbolises panics from the ELF. Debug info lives in non-loadable
# sections, so keeping it costs nothing on flash.
codegen-units = 1
debug         = 2
lto           = "fat"
panic         = "abort"
strip         = false

[profile.bench]
debug     = false
opt-level = 3

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs                  = "warn"
unreachable_pub               = "warn"
unused_qualifications         = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
